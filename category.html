<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop by Category - Buyhelps</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

    <div id="site-header"></div>

    <main>
        <!-- Breadcrumbs -->
        <div class="section-sm">
            <div class="container">
                <div class="breadcrumbs" id="category-breadcrumbs">
                    <a href="index.html">Home</a>
                    <span>/</span>
                    <a href="categories.html">Categories</a>
                    <span>/</span>
                    <span>All Products</span>
                </div>
            </div>
        </div>

        <!-- Catalog Layout -->
        <div class="container">
            <div class="catalog-layout">

                <!-- Sidebar Filters -->
                <aside class="catalog-sidebar">

                    <!-- Categories Filter -->
                    <div class="filter-group">
                        <h3 class="filter-group-title">Categories</h3>
                        <div id="filter-categories">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <!-- Price Range Filter -->
                    <div class="filter-group">
                        <h3 class="filter-group-title">Price Range</h3>
                        <div id="filter-price">
                            <label class="filter-option">
                                <input type="radio" name="price-range" value="all" checked>
                                <span>All</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="price-range" value="under-2000">
                                <span>Under ₹2,000</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="price-range" value="2000-5000">
                                <span>₹2,000 - ₹5,000</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="price-range" value="5000-10000">
                                <span>₹5,000 - ₹10,000</span>
                            </label>
                            <label class="filter-option">
                                <input type="radio" name="price-range" value="over-10000">
                                <span>Over ₹10,000</span>
                            </label>
                        </div>
                    </div>

                    <!-- Sort By -->
                    <div class="filter-group">
                        <h3 class="filter-group-title">Sort By</h3>
                        <select id="sort-select" class="filter-select">
                            <option value="newest">Newest</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="rating">Top Rated</option>
                        </select>
                    </div>

                </aside>

                <!-- Main Content -->
                <div class="catalog-content">
                    <div class="catalog-topbar">
                        <h2 id="category-title">All Products</h2>
                        <span id="product-count">0 products</span>
                    </div>
                    <div class="grid grid-cols-3" id="product-grid">
                        <!-- Populated by JS -->
                    </div>
                </div>

            </div>
        </div>

        <div style="padding-bottom: 4rem;"></div>
    </main>

    <div id="site-footer"></div>
    <div id="cart-drawer-container"></div>
    <div id="search-modal-container"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Inject shared components
        document.getElementById('site-header').innerHTML = getHeaderHTML('shop');
        document.getElementById('site-footer').innerHTML = getFooterHTML();
        document.getElementById('cart-drawer-container').innerHTML = getCartDrawerHTML();
        document.getElementById('search-modal-container').innerHTML = getSearchModalHTML();
        initApp();

        // Read URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const activeCat = urlParams.get('cat');

        // Build category checkboxes
        const filterCategoriesEl = document.getElementById('filter-categories');
        filterCategoriesEl.innerHTML = CATEGORIES.map(cat => {
            const checked = activeCat === cat.id ? 'checked' : '';
            return `<label class="filter-option">
                <input type="checkbox" name="category" value="${cat.id}" ${checked}>
                <span>${cat.icon} ${cat.name}</span>
            </label>`;
        }).join('');

        // Update breadcrumbs based on active category
        function updateBreadcrumbs(catId) {
            const breadcrumbsEl = document.getElementById('category-breadcrumbs');
            if (catId) {
                const cat = CATEGORIES.find(c => c.id === catId);
                if (cat) {
                    breadcrumbsEl.innerHTML = `
                        <a href="index.html">Home</a>
                        <span>/</span>
                        <a href="categories.html">Categories</a>
                        <span>/</span>
                        <span>${cat.name}</span>`;
                    document.title = `${cat.name} - Buyhelps`;
                }
            } else {
                breadcrumbsEl.innerHTML = `
                    <a href="index.html">Home</a>
                    <span>/</span>
                    <a href="categories.html">Categories</a>
                    <span>/</span>
                    <span>All Products</span>`;
                document.title = 'Shop by Category - Buyhelps';
            }
        }

        // Get selected categories
        function getSelectedCategories() {
            const checked = document.querySelectorAll('#filter-categories input[type="checkbox"]:checked');
            return Array.from(checked).map(cb => cb.value);
        }

        // Get selected price range
        function getSelectedPriceRange() {
            const selected = document.querySelector('input[name="price-range"]:checked');
            return selected ? selected.value : 'all';
        }

        // Get sort value
        function getSortValue() {
            return document.getElementById('sort-select').value;
        }

        // Filter & render products
        function renderProducts() {
            const selectedCats = getSelectedCategories();
            const priceRange = getSelectedPriceRange();
            const sortBy = getSortValue();

            // Update breadcrumbs/title for single-cat selection
            if (selectedCats.length === 1) {
                updateBreadcrumbs(selectedCats[0]);
                const cat = CATEGORIES.find(c => c.id === selectedCats[0]);
                document.getElementById('category-title').textContent = cat ? cat.name : 'All Products';
            } else {
                updateBreadcrumbs(null);
                document.getElementById('category-title').textContent = 'All Products';
            }

            // Get products by category
            let products;
            if (selectedCats.length > 0) {
                products = [];
                selectedCats.forEach(catId => {
                    products = products.concat(getProductsByCategory(catId));
                });
                // Deduplicate by id
                const seen = new Set();
                products = products.filter(p => {
                    if (seen.has(p.id)) return false;
                    seen.add(p.id);
                    return true;
                });
            } else {
                products = [...PRODUCTS];
            }

            // Apply price filter
            products = products.filter(p => {
                const price = p.salePrice || p.price;
                switch (priceRange) {
                    case 'under-2000': return price < 2000;
                    case '2000-5000': return price >= 2000 && price <= 5000;
                    case '5000-10000': return price >= 5000 && price <= 10000;
                    case 'over-10000': return price > 10000;
                    default: return true;
                }
            });

            // Apply sorting
            switch (sortBy) {
                case 'price-low':
                    products.sort((a, b) => (a.salePrice || a.price) - (b.salePrice || b.price));
                    break;
                case 'price-high':
                    products.sort((a, b) => (b.salePrice || b.price) - (a.salePrice || a.price));
                    break;
                case 'rating':
                    products.sort((a, b) => b.rating - a.rating);
                    break;
                case 'newest':
                default:
                    // Keep original order (newest first assumed)
                    break;
            }

            // Update count
            document.getElementById('product-count').textContent = `${products.length} product${products.length !== 1 ? 's' : ''}`;

            // Render grid
            const grid = document.getElementById('product-grid');
            if (products.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;opacity:0.6;"><p>No products found matching your filters.</p></div>';
            } else {
                grid.innerHTML = products.map(p => renderProductCard(p)).join('');
            }
        }

        // Set initial breadcrumbs
        updateBreadcrumbs(activeCat);

        // If an active category was passed, set the title
        if (activeCat) {
            const cat = CATEGORIES.find(c => c.id === activeCat);
            if (cat) {
                document.getElementById('category-title').textContent = cat.name;
            }
        }

        // Initial render
        renderProducts();

        // Event listeners for filters
        document.getElementById('filter-categories').addEventListener('change', renderProducts);
        document.getElementById('filter-price').addEventListener('change', renderProducts);
        document.getElementById('sort-select').addEventListener('change', renderProducts);
    </script>

</body>
</html>
