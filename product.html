<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Buyhelps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

  <div id="site-header"></div>

  <main>
    <div class="container" style="padding-top: 1.5rem;">
      <nav class="breadcrumbs" id="product-breadcrumbs">
        <a href="index.html">Home</a>
        <span class="separator">/</span>
        <a href="categories.html">Shop</a>
        <span class="separator">/</span>
        <span class="current">Product</span>
      </nav>

      <div class="product-detail-grid" style="margin-top: 1.5rem;">
        <!-- Left: Gallery -->
        <div class="product-gallery">
          <div class="product-main-image">
            <img id="main-product-image" src="" alt="Product Image">
          </div>
          <div class="product-thumbnails" id="product-thumbnails"></div>
        </div>

        <!-- Right: Info -->
        <div class="product-info-wrap">
          <div class="product-meta-header" id="product-meta"></div>
          <h1 class="product-page-title" id="product-page-title">Loading product...</h1>
          <div class="product-reviews-summary" id="product-rating-summary"></div>
          <div class="product-page-price" id="product-page-price"></div>
          <p class="product-short-desc" id="product-short-desc"></p>

          <!-- Variants -->
          <div id="product-variants"></div>

          <!-- Quantity & Actions -->
          <div class="product-actions-row">
            <div class="product-qty-selector">
              <button type="button" id="qty-minus" aria-label="Decrease quantity">−</button>
              <input type="number" id="qty-input" value="1" min="1" readonly>
              <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
            </div>
            <button class="btn btn-primary" id="add-to-cart-btn" style="flex:1;">Add to Cart</button>
            <button class="btn btn-secondary" id="buy-now-btn">Buy Now</button>
            <button type="button" class="btn btn-secondary" id="product-wishlist-btn" title="Save to Wishlist" style="display:flex;align-items:center;gap:0.4rem;padding:0.75rem 1rem;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              <span class="wishlist-text" style="font-size:0.85rem;font-weight:600;">Wishlist</span>
            </button>
          </div>

          <!-- PIN Code Delivery Estimator -->
          <div class="pincode-checker-box">
            <span style="font-size:0.8rem;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:0.4rem;">Check Delivery &amp; Services</span>
            <div class="pincode-input-row">
              <svg width="18" height="18" fill="none" stroke="#4F46E5" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <input type="text" id="pincode-input" maxlength="6" placeholder="Enter 6-digit PIN (e.g. 560038)" value="560038">
              <button type="button" id="pincode-check-btn" class="btn btn-secondary btn-sm">Check</button>
            </div>
            <div id="pincode-result" class="pincode-result-msg success">
              <span>✓ <strong>Free Express Delivery</strong> by <strong>Monday, Nov 2</strong> • Cash on Delivery available</span>
            </div>
          </div>

          <!-- Accordions -->
          <div class="accordion-box" id="product-accordions"></div>
        </div>
      </div>

      <!-- Related Products -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">You May Also Like</h2>
          <a href="category.html" class="nav-link">View More →</a>
        </div>
        <div class="grid grid-cols-4" id="related-products"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="cart-drawer-container"></div>
  <div id="search-modal-container"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/product-page.js"></script>
  <script>
    // Inject shared layout components
    document.getElementById('site-header').innerHTML = getHeaderHTML('shop');
    document.getElementById('site-footer').innerHTML = getFooterHTML();
    document.getElementById('cart-drawer-container').innerHTML = getCartDrawerHTML();
    document.getElementById('search-modal-container').innerHTML = getSearchModalHTML();
    initApp();

    // Load Product Data via URL query param
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id') || 'wireless-headphones';
    const product = getProductById(productId);

    if (!product) {
      document.querySelector('main').innerHTML = `
        <div class="container section" style="text-align:center;">
          <h2>Product Not Found</h2>
          <p style="margin:1rem 0;color:var(--color-text-muted);">The product you are looking for does not exist or has been moved.</p>
          <a href="categories.html" class="btn btn-primary">Browse All Categories</a>
        </div>`;
    } else {
      document.title = `${product.title} - Buyhelps`;

      const cat = getCategoryById(product.category);
      document.getElementById('product-breadcrumbs').innerHTML = `
        <a href="index.html">Home</a>
        <span class="separator">/</span>
        <a href="categories.html">Categories</a>
        <span class="separator">/</span>
        <a href="category.html?cat=${product.category}">${cat ? cat.name : product.category}</a>
        <span class="separator">/</span>
        <span class="current">${product.title}</span>`;

      // Main image & thumbnails
      const mainImg = document.getElementById('main-product-image');
      mainImg.src = product.images[0];
      mainImg.alt = product.title;
      mainImg.onerror = function() { handleImgError(this, product.title, product.category); };

      document.getElementById('product-thumbnails').innerHTML = product.images.map((img, i) => `
        <button class="thumbnail-btn ${i === 0 ? 'active' : ''}" data-src="${img}" data-alt="${product.title}">
          <img src="${img}" alt="${product.title} thumbnail ${i + 1}" onerror="handleImgError(this, '${product.title.replace(/'/g, "\\'")}', '${product.category}')">
        </button>
      `).join('');

      // Meta header badge
      document.getElementById('product-meta').innerHTML = `
        <span class="category-badge">${cat ? cat.name : product.category}</span>
        ${product.badge ? `<span class="badge badge-${product.badge}" style="margin-left:0.5rem;">${product.badge === 'new' ? 'New Arrival' : product.badge === 'sale' ? 'Sale' : 'Eco Friendly'}</span>` : ''}
      `;

      // Title & reviews
      document.getElementById('product-page-title').textContent = product.title;
      document.getElementById('product-rating-summary').innerHTML = `
        ${renderStars(product.rating)}
        <span style="font-weight:700;">${product.rating}</span>
        <span style="color:var(--color-text-muted);">(${product.reviewCount} reviews)</span>
        <span style="color:var(--color-border);margin:0 0.25rem;">|</span>
        <span style="color:var(--color-success);font-weight:600;">In Stock (${product.stock} available)</span>
      `;

      // Pricing
      const discount = product.originalPrice ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;
      document.getElementById('product-page-price').innerHTML = `
        <span class="current-price">${formatPrice(product.price)}</span>
        ${product.originalPrice ? `<span class="original-price">${formatPrice(product.originalPrice)}</span><span class="discount-badge">Save ${discount}%</span>` : ''}
      `;

      // Short description
      document.getElementById('product-short-desc').textContent = product.description;

      // Variants (Color / Size)
      let variantHTML = '';
      if (product.variants && product.variants.color && product.variants.color.length > 0) {
        variantHTML += `
          <div class="variant-block" style="margin-bottom:1rem;">
            <span class="variant-label">Color: <strong id="selected-color-label">${product.variants.color[0]}</strong></span>
            <div class="variant-options">
              ${product.variants.color.map((c, i) => `
                <button type="button" class="variant-pill ${i === 0 ? 'active' : ''}">${c}</button>
              `).join('')}
            </div>
          </div>`;
      }
      if (product.variants && product.variants.size && product.variants.size.length > 0) {
        variantHTML += `
          <div class="variant-block" style="margin-bottom:1.25rem;">
            <span class="variant-label">Size</span>
            <div class="variant-options">
              ${product.variants.size.map((s, i) => `
                <button type="button" class="variant-pill ${i === 0 ? 'active' : ''}">${s}</button>
              `).join('')}
            </div>
          </div>`;
      }
      document.getElementById('product-variants').innerHTML = variantHTML;

      // Accordions: Specs, Shipping, Reviews
      const specsRows = product.specs.map(s => `
        <tr>
          <td style="padding:0.45rem 0;font-weight:600;width:38%;color:var(--color-text-primary);">${s.label}</td>
          <td style="padding:0.45rem 0;color:var(--color-text-secondary);">${s.value}</td>
        </tr>
      `).join('');

      const reviewsList = product.reviews && product.reviews.length > 0
        ? product.reviews.map(r => `
            <div style="padding:0.85rem 0;border-bottom:1px solid var(--color-border-subtle);">
              <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem;">
                <strong style="font-size:0.9rem;">${r.author}</strong>
                <span>${renderStars(r.rating)}</span>
              </div>
              <p style="font-size:0.875rem;color:var(--color-text-secondary);">${r.text}</p>
            </div>
          `).join('')
        : '<p style="font-size:0.875rem;color:var(--color-text-muted);">No written reviews yet. Be the first to leave a review!</p>';

      document.getElementById('product-accordions').innerHTML = `
        <div class="accordion-item">
          <button class="accordion-trigger" type="button">
            <span>Specifications</span>
            <span class="chevron">+</span>
          </button>
          <div class="accordion-content">
            <table style="width:100%;border-collapse:collapse;font-size:0.9rem;">
              ${specsRows}
            </table>
          </div>
        </div>
        <div class="accordion-item">
          <button class="accordion-trigger" type="button">
            <span>Shipping &amp; Free Returns</span>
            <span class="chevron">+</span>
          </button>
          <div class="accordion-content">
            <p><strong>Free Standard Shipping</strong> on all domestic orders over ₹1,999. Delivered in 3–5 business days.</p>
            <p style="margin-top:0.5rem;"><strong>30-Day Hassle-Free Returns</strong>: If you are not completely satisfied, return within 30 days of purchase for a full refund or exchange.</p>
          </div>
        </div>
        <div class="accordion-item">
          <button class="accordion-trigger" type="button">
            <span>Customer Reviews (${product.reviewCount})</span>
            <span class="chevron">+</span>
          </button>
          <div class="accordion-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
              <strong style="font-size:0.95rem;">Verified Buyer Feedback</strong>
              <button type="button" class="btn btn-secondary btn-sm" onclick="openReviewModal()">★ Write a Review</button>
            </div>
            <div id="reviews-list-container">
              ${reviewsList}
            </div>
          </div>
        </div>
      `;

      // Set product ID on actions
      document.getElementById('add-to-cart-btn').dataset.productId = product.id;
      document.getElementById('product-wishlist-btn').dataset.productId = product.id;
      document.getElementById('related-products').dataset.productId = product.id;

      // Re-initialize gallery, variants, accordions, pincode, wishlist, reviews
      initGallery();
      initVariantPickers();
      initAccordions();
      initRelatedProducts();
      initPincodeChecker();
      initProductWishlist();
      initReviewSystem();
    }
  </script>

  <!-- Review Submission Modal -->
  <div class="account-modal-overlay" id="review-modal-overlay">
    <div class="account-modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:1px solid var(--color-border);">
        <h3 style="font-size:1.2rem;font-weight:800;">Write a Customer Review</h3>
        <button type="button" onclick="closeReviewModal()" style="font-size:1.4rem;line-height:1;opacity:0.6;cursor:pointer;">&times;</button>
      </div>
      <form id="submit-review-form">
        <label class="form-label">Your Rating *</label>
        <div class="star-rating-picker" id="review-star-picker">
          <span data-val="1" class="active">★</span>
          <span data-val="2" class="active">★</span>
          <span data-val="3" class="active">★</span>
          <span data-val="4" class="active">★</span>
          <span data-val="5" class="active">★</span>
        </div>
        <div class="form-group">
          <label class="form-label">Your Name or Alias *</label>
          <input type="text" id="rev-author" class="form-input" placeholder="e.g. Rahul S." required>
        </div>
        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label">Your Review Comments *</label>
          <textarea id="rev-comment" class="form-input" rows="4" placeholder="Share your experience with quality, craftsmanship, or styling..." required></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
          <button type="button" class="btn btn-secondary" onclick="closeReviewModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Review</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
