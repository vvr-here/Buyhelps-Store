<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Buyhelps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

  <div id="site-header"></div>

  <main>
    <div class="container">
      <nav class="breadcrumbs">
        <a href="index.html">Home</a>
        <span class="separator">/</span>
        <span class="current">Cart</span>
      </nav>

      <h2 class="section-title">Shopping Cart</h2>

      <div class="cart-layout" style="display:grid;grid-template-columns:1.65fr 1fr;gap:2.5rem;align-items:start;">
        <div class="cart-table-wrap" id="cart-items-list">
          <!-- Populated by JS -->
        </div>
        <div class="cart-order-summary" id="cart-summary" style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:1.75rem;">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="cart-drawer-container"></div>
  <div id="search-modal-container"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('site-header').innerHTML = getHeaderHTML('cart');
    document.getElementById('site-footer').innerHTML = getFooterHTML();
    document.getElementById('cart-drawer-container').innerHTML = getCartDrawerHTML();
    document.getElementById('search-modal-container').innerHTML = getSearchModalHTML();
    initApp();

    let appliedCartCoupon = null;
    const COUPONS = {
      'BUYHELPS10': { type: 'percent', value: 10 },
      'FESTIVE500': { type: 'flat', value: 500, minOrder: 1999 },
      'VVR1000': { type: 'flat', value: 1000 }
    };

    function applyCartCoupon(code) {
      const cleaned = (code || '').trim().toUpperCase();
      const coupon = COUPONS[cleaned];
      if (!coupon) {
        showToast('Invalid promo code. Try BUYHELPS10 or FESTIVE500');
        return;
      }
      const subtotal = Cart.getSubtotal();
      if (coupon.minOrder && subtotal < coupon.minOrder) {
        showToast(`Minimum order of ${formatPrice(coupon.minOrder)} required`);
        return;
      }
      appliedCartCoupon = { code: cleaned, ...coupon };
      showToast(`Coupon "${cleaned}" applied!`);
      renderCartPage();
    }

    function removeCartCoupon() {
      appliedCartCoupon = null;
      showToast('Coupon removed');
      renderCartPage();
    }

    function renderCartPage() {
      const cart = Cart.getCart();
      const listEl = document.getElementById('cart-items-list');
      const summaryEl = document.getElementById('cart-summary');

      if (cart.length === 0) {
        listEl.innerHTML = `<div style="text-align:center;padding:3rem;">
          <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 1rem;opacity:0.3;display:block;"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <h3 style="font-weight:700;margin-bottom:0.5rem;">Your cart is empty</h3>
          <p style="color:var(--color-text-muted);margin-bottom:1.5rem;">Looks like you haven't added anything yet.</p>
          <a href="categories.html" class="btn btn-primary">Start Shopping</a>
        </div>`;
        summaryEl.innerHTML = '';
        return;
      }

      listEl.innerHTML = cart.map(item => `
        <div class="cart-item" style="padding:1.25rem 0;border-bottom:1px solid var(--color-border);display:flex;gap:1.25rem;">
          <img class="cart-item-img" src="${item.product.images[0]}" alt="${item.product.title}" loading="lazy" onerror="handleImgError(this, '${item.product.title.replace(/'/g, "\\'")}', '${item.product.category}')" style="width:90px;height:90px;object-fit:cover;border-radius:var(--radius-md);">
          <div class="cart-item-info" style="flex:1;">
            <div style="display:flex;justify-content:space-between;align-items:start;">
              <div>
                <div class="cart-item-title" style="font-weight:600;">${item.product.title}</div>
                ${item.variant ? '<div class="cart-item-variant" style="font-size:0.85rem;color:var(--color-text-muted);margin-top:0.2rem;">' + item.variant + '</div>' : ''}
              </div>
              <span class="cart-item-price" style="font-weight:700;">${formatPrice(item.lineTotal)}</span>
            </div>
            <div class="cart-item-bottom" style="margin-top:0.75rem;display:flex;justify-content:space-between;align-items:center;">
              <div class="qty-control" style="display:flex;align-items:center;border:1px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden;">
                <button class="qty-btn" onclick="Cart.updateQty('${item.id}','${item.variant}',${item.qty - 1})" style="width:32px;height:32px;border:none;background:none;cursor:pointer;font-size:1rem;">−</button>
                <input class="qty-input" type="number" value="${item.qty}" min="1" readonly style="width:40px;height:32px;text-align:center;border:none;border-left:1px solid var(--color-border);border-right:1px solid var(--color-border);font-family:inherit;font-size:0.9rem;">
                <button class="qty-btn" onclick="Cart.updateQty('${item.id}','${item.variant}',${item.qty + 1})" style="width:32px;height:32px;border:none;background:none;cursor:pointer;font-size:1rem;">+</button>
              </div>
              <span class="cart-item-remove" onclick="Cart.removeItem('${item.id}','${item.variant}')" style="font-size:0.85rem;color:var(--color-text-muted);cursor:pointer;text-decoration:underline;">Remove</span>
            </div>
          </div>
        </div>
      `).join('');

      const subtotal = Cart.getSubtotal();
      const freeShippingThreshold = 1999;
      const shipping = subtotal >= freeShippingThreshold || subtotal === 0 ? 0 : 149;

      let discount = 0;
      if (appliedCartCoupon) {
        if (appliedCartCoupon.type === 'percent') {
          discount = Math.round((subtotal * appliedCartCoupon.value) / 100);
        } else if (appliedCartCoupon.type === 'flat') {
          discount = Math.min(appliedCartCoupon.value, subtotal);
        }
      }

      const total = Math.max(0, subtotal - discount + shipping);

      summaryEl.innerHTML = `
        <h3 style="font-size:1.25rem;font-weight:700;margin-bottom:1.25rem;">Order Summary</h3>
        <div class="summary-row" style="display:flex;justify-content:space-between;margin-bottom:0.75rem;"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
        ${discount > 0 ? `
          <div class="summary-row" style="display:flex;justify-content:space-between;margin-bottom:0.75rem;color:#15803D;font-weight:600;">
            <span>Promo Discount (${appliedCartCoupon.code})</span>
            <span>- ${formatPrice(discount)}</span>
          </div>
        ` : ''}
        <div class="summary-row" style="display:flex;justify-content:space-between;margin-bottom:0.75rem;"><span>Delivery</span><span>${shipping === 0 ? '<span style="color:#15803D;font-weight:700;">Free</span>' : formatPrice(shipping)}</span></div>
        ${shipping > 0 ? '<p style="font-size:0.8rem;color:var(--color-success);margin-bottom:1rem;">Add ' + formatPrice(freeShippingThreshold - subtotal) + ' more for free delivery!</p>' : '<p style="font-size:0.8rem;color:var(--color-success);margin-bottom:1rem;">✓ You qualify for free delivery!</p>'}
        
        <!-- Promo Code Box -->
        <div class="checkout-coupon-box" style="margin:1rem 0;">
          <label style="display:block;font-size:0.85rem;font-weight:700;margin-bottom:0.4rem;">Promo Code</label>
          ${appliedCartCoupon ? `
            <div class="coupon-applied-badge">
              <span>🎟️ <strong>${appliedCartCoupon.code}</strong> Applied</span>
              <button type="button" onclick="removeCartCoupon()" style="background:none;border:none;color:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;">&times;</button>
            </div>
          ` : `
            <div class="coupon-input-wrap">
              <input type="text" id="cart-coupon-input" class="form-input" placeholder="e.g. BUYHELPS10" style="flex:1;padding:0.5rem 0.75rem;font-size:0.85rem;text-transform:uppercase;">
              <button type="button" class="btn btn-secondary" onclick="applyCartCoupon(document.getElementById('cart-coupon-input').value)" style="padding:0.5rem 0.85rem;font-size:0.85rem;">Apply</button>
            </div>
            <div style="display:flex;gap:0.35rem;margin-top:0.45rem;flex-wrap:wrap;">
              <span onclick="applyCartCoupon('BUYHELPS10')" style="font-size:0.75rem;background:var(--color-surface-subtle);border:1px dashed var(--color-border);padding:0.15rem 0.45rem;border-radius:4px;cursor:pointer;">🎟️ BUYHELPS10</span>
              <span onclick="applyCartCoupon('FESTIVE500')" style="font-size:0.75rem;background:var(--color-surface-subtle);border:1px dashed var(--color-border);padding:0.15rem 0.45rem;border-radius:4px;cursor:pointer;">🎉 FESTIVE500</span>
            </div>
          `}
        </div>

        <div class="summary-row total" style="display:flex;justify-content:space-between;padding-top:1rem;border-top:1px solid var(--color-border);font-weight:700;font-size:1.1rem;"><span>Total</span><span>${formatPrice(total)}</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:1.5rem;">Proceed to Checkout</a>
        <a href="categories.html" class="btn btn-outline btn-block" style="margin-top:0.5rem;">Continue Shopping</a>
      `;
    }

    renderCartPage();
    window.addEventListener('cart:updated', renderCartPage);
  </script>
</body>
</html>
